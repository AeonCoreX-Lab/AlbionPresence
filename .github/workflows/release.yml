# Release workflow.
#
# UNVERIFIED: this workflow has never run. Its YAML was syntax-checked only.
#
# Fails loudly if signing secrets are missing: it never publishes an unsigned
# or debug-signed APK as a release. See docs/RELEASING.md for how to create the
# keystore and set the secrets. No key, password or credential lives in the
# repository.
#
# Not yet handled (Phase 3): the Discord Social SDK is not in the repository and
# its distribution terms must be reviewed before publishing binaries that bundle
# it. Until then a release built here contains no SDK and cannot publish presence.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    env:
      ALBIONPRESENCE_KEYSTORE_BASE64: ${{ secrets.ALBIONPRESENCE_KEYSTORE_BASE64 }}
      ALBIONPRESENCE_KEYSTORE_PASSWORD: ${{ secrets.ALBIONPRESENCE_KEYSTORE_PASSWORD }}
      ALBIONPRESENCE_KEY_ALIAS: ${{ secrets.ALBIONPRESENCE_KEY_ALIAS }}
      ALBIONPRESENCE_KEY_PASSWORD: ${{ secrets.ALBIONPRESENCE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require signing secrets
        run: |
          missing=0
          for name in ALBIONPRESENCE_KEYSTORE_BASE64 ALBIONPRESENCE_KEYSTORE_PASSWORD ALBIONPRESENCE_KEY_ALIAS ALBIONPRESENCE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (see docs/RELEASING.md)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run checks before building
        run: |
          npm run typecheck
          npm run lint
          npm test -- --ci
      - name: Decode keystore
        run: |
          echo "$ALBIONPRESENCE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ALBIONPRESENCE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify the APK signature is not the debug key
        run: |
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -n1)"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if grep -qi "Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::Release APK is signed with the Android debug key"
            exit 1
          fi
      - name: Record checksum
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum *.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: albionpresence-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: albionpresence-release
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AlbionPresence $TAG" \
            --generate-notes \
            --prerelease
