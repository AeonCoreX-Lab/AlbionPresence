# Continuous integration.
#
# UNVERIFIED: this workflow has never run. Its YAML was syntax-checked only.
# Jobs that need the generated React Native project are skipped, not faked,
# until `scripts/bootstrap.sh` has been run and its output committed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-core:
    name: Kotlin core tests (no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
      - name: Compile and test the pure-Kotlin core
        run: scripts/verify-kotlin-core.sh

  javascript:
    name: TypeScript, ESLint, Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the project has been bootstrapped
        id: project
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::package.json not found: run scripts/bootstrap.sh and commit its output. JavaScript checks skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.project.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        if: steps.project.outputs.present == 'true'
        run: npm ci
      - name: Type-check
        if: steps.project.outputs.present == 'true'
        run: npm run typecheck
      - name: ESLint
        if: steps.project.outputs.present == 'true'
        run: npm run lint
      - name: Unit tests
        if: steps.project.outputs.present == 'true'
        run: npm test -- --ci

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: [kotlin-core, javascript]
    steps:
      - uses: actions/checkout@v4
      - name: Check the Android project exists
        id: project
        run: |
          if [ -f android/gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::android/gradlew not found: run scripts/bootstrap.sh and commit its output. Debug build skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.project.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        if: steps.project.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Install JavaScript dependencies
        if: steps.project.outputs.present == 'true'
        run: npm ci
      - name: Build debug APK
        if: steps.project.outputs.present == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      # A debug APK is signed by Android's auto-generated debug key. It is never a
      # release build and must not be distributed as one. The Discord Social SDK
      # is not part of this build (see docs/BUILDING.md).
      - uses: actions/upload-artifact@v4
        if: steps.project.outputs.present == 'true'
        with:
          name: albionpresence-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
